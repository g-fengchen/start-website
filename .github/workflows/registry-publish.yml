name: CI for Projects

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - v3
jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set_outputs.outputs.projects }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Find projects
        id: set_outputs
        run: |
          projects=$(find . -maxdepth 1 -mindepth 1 -type d | sed 's|./||' | jq -R . | jq -s .) # 获取子目录并转换为JSON数组
          echo "::set-output name=projects::$projects" # 设置输出
        
