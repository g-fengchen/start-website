name: CI

on:
  push:
    branches:
      - v3
    paths:
      - "**/publish.yaml"

jobs:
  find-directories:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.set-dirs.outputs.directories }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Find modified directories
        id: set-dirs
        run: |
          # 检查是否存在父提交
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # 获取当前提交和之前提交之间的差异，得到改变的文件列表
            MODIFIED_PATHS=$(git diff --name-only HEAD^ HEAD)
          else
            echo "No parent commit found (initial commit), comparing against empty tree."
            MODIFIED_PATHS=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          # 初始化一个数组来保存找到的目录
          DIRECTORIES=()

          # 搜索匹配条件的路径并保存目录名称
          for path in $MODIFIED_PATHS; do
            if [[ $path == */publish.yaml ]]; then
              # 提取目录名称并添加到数组
              DIRECTORY=$(dirname "$path")
              DIRECTORIES+=("$DIRECTORY")
            fi
          done

          # 将数组转换为字符串，用逗号分隔
          DIRECTORIES_STR=$(IFS=,; echo "${DIRECTORIES[*]}")
          echo "Found directories: $DIRECTORIES_STR"

          json_array=$(echo "$DIRECTORIES_STR" | jq -R 'split(",")')
          echo "Found  array directories: $json_array"

          # 导出找到的目录，以便在后续的任务中使用
          echo "directories=$json_array" >> $GITHUB_OUTPUT
