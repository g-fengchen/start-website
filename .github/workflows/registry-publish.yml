name: CI for Projects

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - v3
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.get-dirs.outputs.dirs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 获取变更的一级目录列表
        id: get-dirs
        run: |
          # 提取所有提交中变更的文件路径，并获取一级目录名
          DIRS=$(git diff --name-only HEAD^ HEAD | cut -d'/' -f1 | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "变更目录列表: $DIRS"
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.dirs) }} # 使用扫描结果构建矩阵
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run build for ${{ matrix.project }}
        run: echo "Building Project ${{ matrix.project }}"
