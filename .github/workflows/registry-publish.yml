name: CI for Projects

on:
  push:
    paths:
      - '*/**
jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set_outputs.outputs.projects }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Find projects
        id: set_outputs
        run: |
          projects=$(find . -maxdepth 1 -mindepth 1 -type d | sed 's|./||') # 获取子目录
          echo "::set-output name=projects::${projects}" # 设置输出

  build:
    runs-on: ubuntu-latest
    needs: scan
    strategy:
      matrix:
        project: ${{ fromJson(needs.scan.outputs.projects) }} # 使用扫描结果构建矩阵
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run build for ${{ matrix.project }}
        run: echo "Building Project: ${{ matrix.project }}"
