name: CI

on:
  push:
    branches:
      - v3
    paths:
      - "**/publish.yaml"

jobs:
  find-directories:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.get-directories.outputs.directories }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Find modified directories
        id: get-directories
        run: |
          MODIFIED_PATHS=$(git diff --name-only HEAD^ HEAD)
          DIRECTORIES=()
          for path in $MODIFIED_PATHS; do
            if [[ $path == */publish.yaml ]]; then
              DIRECTORY=$(dirname "$path")
              # 确保只添加唯一目录
              [[ ! " ${DIRECTORIES[@]} " =~ " ${DIRECTORY} " ]] && DIRECTORIES+=("$DIRECTORY")
            fi
          done

          # 确保输出JSON始终有效
          if [ ${#DIRECTORIES[@]} -eq 0 ]; then
            json_dirs="[]"
          else
            # 去除所有空白字符并转换为合法的 JSON
            json_dirs=$(printf '%s\n' "${DIRECTORIES[@]}" | jq -R . | jq -s . | xargs)
          fi

          # 打印输出进行调试
          echo "Found directories JSON: $json_dirs"

          # 将目录字符串导出到环境变量
          echo "directories=$json_dirs" >> $GITHUB_OUTPUT

  print-directories:
    runs-on: ubuntu-latest
    needs: find-directories
    strategy:
      matrix:
        dir: ${{ fromJson(needs.find-directories.outputs.directories) }}
    steps:
      - name: Trigger build for each directory
        uses: ./.github/workflows/build-project.yml
        with:
          project: ${{ matrix.dir }}
