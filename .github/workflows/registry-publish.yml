name: CI

on:
  push:
    branches:
      - v3

jobs:
  check_changes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - docusaurus

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Determine if publish.yaml has changed
        id: check_projects
        run: |
          echo "Comparing commits: ${{ github.event.before }} and ${{ github.sha }}"
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "${{ matrix.project }}/publish.yaml"; then
            echo "changed_projects=${{ matrix.project }}" >> $GITHUB_ENV  # 仅设置当前项目
            echo "Projects changed: ${{ matrix.project }}"
          else
            echo "changed_projects=none" >> $GITHUB_ENV
            echo "Projects changed: none"
          fi

  build:
    needs: check_changes
    runs-on: ubuntu-latest
    steps:
      - name: console env
        run: |
          echo "ENV ${{ env.changed_projects }}"
      - name: Call Build Workflow
        if: env.changed_projects != 'none' && env.changed_projects != ''
        run: |
          echo "Calling build workflow for ${{ env.changed_projects }}"
