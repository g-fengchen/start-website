name: CI

on:
  push:
    branches:
      - v3

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      all_changed_projects: ${{ steps.collect_changes.outputs.changed_projects }}
    strategy:
      matrix:
        project:
          - docusaurus
          - dumi

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Initialize changed projects
        run: echo "CHANGED_PROJECTS=" >> $GITHUB_ENV

      - name: Check if publish.yaml has changed
        id: check_project
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "${{ matrix.project }}/publish.yaml"; then
            echo "${{ matrix.project }}" >> changed_projects.txt
          fi

      - name: Append to environment variable
        if: ${{ success() }}
        run: |
          if [ -f changed_projects.txt ]; then
            PROJECTS=$(cat changed_projects.txt | tr '\n' ' ')
            echo "CHANGED_PROJECTS=$PROJECTS $CHANGED_PROJECTS" >> $GITHUB_ENV
          fi

      - name: Collect changes
        id: collect_changes
        run: echo "changed_projects=${{ env.CHANGED_PROJECTS }}" >> $GITHUB_OUTPUT

  build:
    needs: check_changes
    runs-on: ubuntu-latest
    steps:
      - name: Check if there are any changed projects
        id: output_changed_projects
        run: |
          changed_projects="${{ needs.check_changes.outputs.all_changed_projects }}"
          echo "Changed projects: ${changed_projects}"
          if [[ -z "${changed_projects// }" || "${changed_projects}" == "" ]]; then
            echo "No changes to build."
            exit 0
          fi

      - name: Call Build Workflow
        run: echo "Calling build workflow for ${{ needs.check_changes.outputs.all_changed_projects }}"
