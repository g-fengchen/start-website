name: Build Project

on:
  workflow_call: # 允许其他工作流调用此工作流
    inputs:
      project:
        required: true
        type: string
    secrets:
      TEST:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "${{ inputs.project }}"
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Print project input
        run: |
          echo "当前位置：$(pwd)"
          ls -la
          echo "Project input value is ${{ inputs.project }}"

      - name: console secrets
        run: |
          echo "当前位置：$(pwd)"
          ls -la
          echo "Project secrets test is ${{ secrets.TEST }}"
